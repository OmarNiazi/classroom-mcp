[project]
name = "classroom-mcp"
version = "0.2.1"
description = "Google Classroom MCP server for students: courses, assignments with your submission status, and announcements."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Omar Niazi" }]
requires-python = ">=3.11"
keywords = ["mcp", "google-classroom", "claude", "students", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Education",
]
dependencies = [
    "mcp>=1.30,<2",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.2",
    "platformdirs>=4.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/OmarNiazi/classroom-mcp"
Issues = "https://github.com/OmarNiazi/classroom-mcp/issues"

[project.scripts]
classroom-mcp = "classroom_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classroom_mcp"]

# Explicit allowlist so nothing local (old token.json / credentials.json, docs,
# CI config) can end up in the published source archive.
[tool.hatch.build.targets.sdist]
include = ["src/classroom_mcp", "tests", "README.md", "LICENSE", "PRIVACY.md", "SECURITY.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
